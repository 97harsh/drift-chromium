name: Build macOS binaries of Ungoogled Chromium
# Drift: manual runs only while we prove builds on GitHub's free runners.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS binaries of Ungoogled Chromium
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: true
      max-parallel: 2
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      # Free standard runner for public repos (3-core M1, 7 GB RAM). Chained jobs
      # in building.yml resume the build across GitHub's 6-hour job limit.
      os: macos-latest
